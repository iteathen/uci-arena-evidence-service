meta:
  spec_id: evidence_service_repository_boundary_v1
  version: 1
  status: active
  owner: release_engineering

repository:
  canonical: iteathen/uci-arena-evidence-service
  visibility: private
  source_root: .
  upstream_authority: iteathen/UCI_Arena

github_automation:
  automatic_ci: disabled
  forbidden_automatic_triggers: [pull_request, push, merge_group, schedule]
  validation_authority: local_before_pull_request_and_merge
  manual_release:
    workflow: .github/workflows/component-release.yml
    trigger: workflow_dispatch_only
  rules:
    - Pull requests and branch pushes never start GitHub-hosted validation.
    - Exact local check commands and outcomes are recorded before merge.
    - Component release and provenance run only after explicit operator dispatch
      and are not automatically required pull-request status checks.

contracts:
  component_id: uci_arena_evidence.service
  installed_cli: services/evidence-service/src/cli.mjs
  runtime_component: uci_arena_evidence.runtime
  manager_integration_api:
    schema: uci_arena_manager_service_api_v1
    version: '1.0'
    transport: cli_json
  shared_packages:
    - '@uci-arena/background-service-runtime'
    - '@uci-arena/time-profile-contract'
  shared_runtime_lock: vendor/upstream.lock.json

rules:
  - Source imports never escape the repository root.
  - UCI Arena, Book Forge, and Manager checkouts are unavailable to clean builds.
  - Vendored upstream packages are regular files and match the upstream lock.
  - Runner and referee implementations are absent from this repository.
  - Runtime contract mismatches fail before a job starts.
  - UCI Arena Manager remains the only suite composition and promotion authority.
  - Manager discovers the API through arena-component.json and never opens the
    Evidence catalog, scans artifact storage, or infers evidence authority from
    raw files.
  - Unknown API major versions, component substitution, malformed output
    identities, and unvalidated artifact paths fail closed.

validation:
  - exact_vendor_lock
  - repository_import_boundary
  - clean_npm_install
  - source_tests
  - absent_runtime_healthy_waiting_state
  - pinned_runtime_integration
  - deterministic_component_candidate
  - keyless_signed_provenance
