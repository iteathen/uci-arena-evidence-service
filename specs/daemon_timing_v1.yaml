meta:
  spec_id: evidence_daemon_timing_v1
  version: 1
  status: active
  owner: daemon_lifecycle
  purpose: >
    Keep daemon scheduling intervals bounded under one internal authority
    instead of accepting arbitrary operator timer values.

authority:
  parent_specs:
    - specs/00_READ_FIRST.yaml
    - specs/repository_boundary_v1.yaml
    - specs/uci_arena_evidence_service_v1.yaml

ownership:
  component: src/daemon_timing.mjs
  owns:
    - canonical heartbeat interval
    - canonical cycle interval
    - canonical stale-heartbeat threshold value
    - compatibility configuration validation
  rules:
    - Configuration loading validates but does not redefine daemon timing.
    - Existing daemon code may consume the validated compatibility projection.
    - A future timing change requires a reviewed contract version.
    - Heartbeat-stale status projection is not claimed by this change and remains a separate audit item.

canonical_timing:
  heartbeat_ms: 15000
  cycle_ms: 60000
  stale_ms: 300000
  rules:
    - The heartbeat and stale values preserve the primary service contract.
    - The cycle interval preserves the existing one-minute daemon scheduling cadence.
    - All values are safe integers and are not operator-tunable in version 1.

configuration_compatibility:
  field: daemon
  canonical_keys: [heartbeatMs, cycleMs, staleMs]
  rules:
    - Existing configuration documents may retain or omit the daemon object.
    - Omitted keys normalize to canonical defaults during ordinary configuration merging.
    - After merging, the projection contains exactly the three canonical keys.
    - Every projected value must exactly equal the canonical value.
    - Unknown keys, non-integers, and changed values fail configuration loading.
    - A partial input containing only canonical values is accepted and normalizes to the complete projection.
    - Future timer configurability requires a new reviewed contract version rather than accidental numeric acceptance.

validation:
  required:
    - canonical_timing_accepted
    - altered_timing_rejected
    - unknown_timing_key_rejected
    - noninteger_timing_rejected
    - configuration_loader_uses_canonical_defaults
    - configuration_loader_normalizes_partial_canonical_input
    - configuration_loader_rejects_timer_override
