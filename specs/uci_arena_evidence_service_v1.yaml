spec:
  id: uci_arena_evidence_service_v1
  version: 1
  status: active
  owner: iteathen/uci-arena-evidence-service
  purpose: >
    Run existing UCI Arena timing, match, and qualification tools as durable,
    identity-bound background jobs without moving chess, UCI, search, referee,
    or statistical authority into the service.

ownership:
  service:
    - target_resolution
    - durable_job_queue
    - idle_resource_admission
    - background_lease
    - subprocess_lifecycle
    - raw_artifact_retention
    - observation_normalization
    - dataset_manifests
    - qualified_time_profile_publication
  existing_tools:
    arena_run_sprt_match: node_clocked_game_controller_and_paired_sprt_math
    arena_run_complete_game_matrix: bounded_complete_game_diagnostic
    uci_arena_complete_game_referee: cpp_legal_move_and_terminal_state_authority
    engine_qualify_uci_time_profile: timing_sample_validation_and_profile_construction
    arena_gpu_resource_isolation: performance_and_strength_resource_authority
  forbidden:
    - second_chess_controller
    - second_uci_protocol_implementation
    - arbitrary_queued_commands
    - training_or_match_hot_path_imports
    - automatic_uci_default_changes
    - automatic_adaptive_play_promotion
    - python_service_or_adapter_runtime

runtime:
  language: node
  implementation_languages: [node, cpp]
  node_execution: jit
  ui_language_if_added_later: react
  minimum_node: 24.15.0
  supported_platforms: [windows, linux]
  default_workspace:
    windows: "E:/uci-arena-evidence"
    linux: "${XDG_STATE_HOME:-$HOME/.local/state}/uci-arena-evidence"
  workspace_environment: UCI_ARENA_EVIDENCE_ROOT
  startup:
    windows: per_user_windows_task_scheduler_logon_task
    linux: systemd_user_service
    lifecycle_verification:
      - Daemon singleton ownership is an exact process-instance identity that
        binds pid, OS process-start identity, executable identity, and a
        provider nonce. A reused numeric pid is stale ownership, while an
        exact live owner is never displaced.
      - Startup install succeeds only when the generated registration matches
        the current package, workspace, and configuration and the daemon is
        observed active. Install first drains any existing registration and
        exact lock-owning daemon through the same verified uninstall path, so
        upgrading from an older provider cannot race its delayed Job Object
        teardown.
      - Startup uninstall reads the owned daemon lock before requesting stop,
        waits at most two seconds for that exact process to exit, and fails
        closed instead of racing payload replacement or a new daemon. After
        verified exit it removes only a lock still owned by that dead process.
      - Startup status reports registration presence, current-configuration
        agreement, and live daemon activity as separate fields.
      - Windows process-instance observation uses only the explicitly selected,
        capability-qualified public native process query from the immutable
        shared runtime package. Identity-dependent CLI operations qualify it
        after configuration loading and before catalog construction; direct
        daemon composition qualifies it before singleton acquisition. Pure
        description/configuration operations require no identity dependency.
        There is no PowerShell identity fallback, prewarm, or supervisor-start
        coupling. Linux retains its procfs process-birth identity.
      - Native identity requests preserve the default two-second bound and
        consume the caller's shrinking 1..2000 ms exit budget. Persisted Windows
        identity fields use the public contract's exact string tick, PID, and
        32767 UTF-16-unit path domain without numeric coercion.
      - One owned daemon-record reader bounds input to the public native
        response byte budget (262144 bytes), decodes UTF-8 without replacement,
        and serves both singleton acquisition and startup teardown. Malformed
        or unknown records, schemas, fields, and declared identities fail
        closed; only the recognized unversioned PID/nonce/started_at legacy
        record may use the existing stale-heartbeat migration rule.
  single_instance: true
  heartbeat_seconds: 15
  stale_seconds: 300
  commands:
    - init
    - daemon
    - status
    - pause
    - resume
    - target_add
    - target_list
    - target_remove
    - job_enqueue
    - job_list
    - job_cancel
    - job_retry
    - dataset_list
    - dataset_show
    - dataset_export
    - profile_list
    - prune
    - startup_install
    - startup_status
    - startup_recover
    - startup_uninstall
    - api_describe
    - api_status
    - api_outputs_list
    - api_outputs_inspect
    - api_config_validate
    - api_target_register

target_resolution:
  active_pointer: runtime_state/active_model_runtime.json
  explicit_targets: true
  identity_fields:
    - model_id
    - model_root
    - model_fingerprint
    - engine_path
    - engine_sha256
    - provider
    - hardware_driver_fingerprint
    - uci_options
  rules:
    - "An absent active pointer and empty explicit target queue is a healthy waiting state."
    - "A job without an explicit target UUID resolves the current valid active pointer first. If the active pointer is unavailable, exactly one registered explicit target is the provider-owned fallback; multiple explicit targets without a valid active pointer are ambiguous and remain waiting for an operator-selected service UUID."
    - "Registered targets are immutable historical identities. Their count or age never overrides a valid active pointer, and Manager must not infer default target policy from the target projection."
    - "Identity drift after enqueue invalidates the attempt and returns the job to waiting_for_target."
    - "No target field may be guessed from a filename."

catalog:
  implementation: sqlite_single_writer
  schema: uci_arena_evidence_catalog_v1
  job_states: [queued, waiting_for_target, waiting_for_resources, running, completed, failed, cancelled]
  dataset_states: [collecting, completed, cancelled]
  raw_storage: immutable_content_addressed_files
  observation_schema: uci_arena_observation_envelope_v1
  dataset_schema: uci_arena_evidence_dataset_v1
  status_schema: uci_arena_evidence_status_v1
  retention:
    policy: lossless_until_explicit_audited_prune
    minimum_free_workspace_gib: 75
    pressure_behavior: pause_writes
  rules:
    - "Every raw artifact is hashed before catalog insertion."
    - "Atomic rename publishes manifests, control state, status, and profile candidates."
    - "Interrupted and contaminated attempts remain visible but never become authoritative observations."
    - "Every authoritative JSON column is decoded by its named catalog domain with exact JSON syntax, a plain-object top level, bounded depth/cardinality/content, and domain-specific minimum shape checks. Generic catch-and-substitute objects are forbidden."
    - "Job configuration and target UCI-option corruption block scheduling and adapter construction with the one stable EVIDENCE_CATALOG_CORRUPT diagnostic; no empty/default workload or option set is substituted."
    - "Dataset target identity/authority and observation identity, axes, metrics, outcome, resource, and authority corruption block projection, export, qualification, and publication authority. Daemon-report corruption blocks status projection through the same bounded diagnostic."
    - "Persisted job configuration, target options, and daemon reports are at most 262144 UTF-8 bytes; identity, axes, outcome, resource, and authority objects are at most 1048576 bytes; observation metrics are at most 4194304 bytes. Parsed trees are limited to depth 32, 100000 values, 4096 object keys with names of 1..256 characters, 65536 array entries, and 1048576 characters per string."
    - "Known legacy JSON repair, when required, is one explicit versioned migration. Syntax errors, wrong top-level types, incompatible field types, unknown corruption, and malformed durable content are never repaired implicitly or echoed in diagnostics."
    - "Cancelling a job atomically closes its one-to-one dataset as cancelled; retrying that job atomically reopens the dataset as collecting. Manager projects this provider-owned lifecycle and never infers it from job rows."
    - "Catalog open repairs a retained legacy contradiction only when a non-completed collecting dataset has one or more jobs and every referencing job is cancelled. The repair preserves the dataset and evidence, clears authority, and records cancellation completion from the latest job transition; mixed or ambiguous states are never guessed or deleted."
    - "Prune requires an explicit before timestamp and confirmation token and emits an audit record."

observation_envelope:
  required:
    - schema
    - observation_id
    - dataset_id
    - job_id
    - shard_id
    - recorded_at
    - adapter
    - source_schema
    - raw_sha256
    - target_identity
    - axes
    - metrics
    - outcome
    - resource
    - authority
  authority:
    fields: [diagnostic, timing, strength, profile_publication, reasons]
    rule: >
      Timing, strength, and profile-publication authority require a clean,
      complete resource interval plus the tool-specific correctness and
      statistical gates. Shared, missing, expired, interrupted, identity-drifted,
      or contaminated evidence is diagnostic only.

resource_coordination:
  lease_schema: uci_arena_background_resource_lease_v1
  scope: host_account_global_os_temp
  priority: [foreground_restaurant_or_arena, heavy_background_fifo]
  background_producers: [uci_arena_evidence_service, book_forge]
  courtesy_book_forge_work: [acquisition, status, integration_publication, qualified_publication]
  heavy_book_forge_work: [stockfish_analysis, ingestion_and_maintenance]
  service_concurrency: 1
  sampling_interval_ms: 1000
  revocation_abort_ms: 2000
  start_thresholds:
    consecutive_idle_samples: 3
    input_idle_ms: 60000
    maximum_cpu_used_percent: 20
    maximum_gpu_used_percent: 5
    maximum_memory_used_percent: 70
    minimum_available_memory_gib: 6
    minimum_free_workspace_gib: 75
  hard_stops:
    - operator_pause
    - foreground_lease_request
    - restaurant_owner_active
    - unowned_uci_arena_process
    - configured_priority_process
    - battery_or_battery_saver
    - thermal_or_power_limit
    - memory_pressure
    - disk_pressure
  rules:
    - "Low impact is achieved through admission, one-shard concurrency, low OS priority, and immediate revocation; target topology is never silently throttled."
    - "Foreground requests preempt background holders and must become runnable within two seconds."
    - "A lease contains pid, producer, nonce, heartbeat, priority, and inherited token; dead-owner leases are recoverable."
    - "The daemon lock is retired only after its exact persisted identity is rechecked; unverifiable current ownership fails closed, and legacy pid-only locks become reclaimable through the bounded stale-heartbeat migration rule."
    - "A service child validates the inherited token instead of creating a competing foreground request."
    - "The complete child process tree is terminated on revocation or daemon death."
    - "Windows uses the native Job Object/EcoQoS helper when available and otherwise remains functional with portable low-priority controls."
    - "Linux uses a systemd user service with Nice=15, CPUWeight=10, IOWeight=10, OOMScoreAdjust=500, KillMode=control-group, and process-group cleanup for direct runs."
    - "Platform startup registration, process enumeration, executable defaults, and user-idle probes live behind platform adapters; catalog and evidence schemas are identical."

adapters:
  allowlist:
    timing_profile:
      tool: engine/tools/qualify_uci_time_profile.mjs
      output_schemas: [uci_time_profile_attempt_v3, uci_time_profile_v3]
    paired_sprt:
      tool: arena/run_sprt_match.mjs
      output_schemas: [uci_arena_paired_sprt_v2]
    complete_game:
      tool: arena/run_complete_game_matrix.mjs
      output_schemas: [uci_arena_complete_game_matrix_v3, uci_arena_complete_game_matrix_v4]
  rules:
    - "Adapters construct arguments from validated typed job fields only."
    - "Unknown adapters, flags, schemas, and identity fields fail closed."
    - "The timing adapter declares both the exact candidate file and its sibling qualification-attempt directory as bounded outputs. Attempt records are content-addressed diagnostic-only observations; they never satisfy timing or publication authority."
    - "A failed timing attempt with a producer error is retained before the job fails, and the job reports that exact bounded producer error instead of replacing it with a missing-identity or generic-exit diagnostic."
    - "A recognized adapter artifact that records producer failures is rejected with the exact producer failure before source-identity normalization; secondary missing-identity diagnostics must not mask the originating failure."
    - "Service adapters execute Node entrypoints and C++ binaries only."
    - "The Node paired runner owns deterministic manifests, clock controls, checkpoint/resume, single-game shards, and MCGS telemetry while the C++ referee owns chess legality and terminal state."
    - "The service never injects a legacy timing-policy experiment. Candidate and control options come from the exact registered target plus explicitly declared job overrides; live MCGS timing identity remains McgsTimePolicy=RelativeClockTemporalV1."
    - "Complete-game matrix outputs remain diagnostic-only."
    - "Complete-game v3 retains its historical schema and runtime diagnostics; v4 adds continuous-focus and bounded-queue runtime diagnostics. The service preserves each source schema, raw artifact, summary, runtime contract, and completion flag without translating search semantics or acquiring timing, strength, or profile-publication authority. Unknown complete-game versions fail closed."
    - "The complete-game adapter passes an explicit fixed-depth topology activation target at or beyond the configured split depth and a separate timed deadline-probe budget; neither gate may substitute for the other."
    - "Max-ply adjudications, incomplete color pairs, engine failures, and aborted games have no strength authority."

time_profile_publication:
  filename: uci_time_profile_v3.json
  candidate_mode: required
  requirements:
    - exact_target_identity
    - qualifier_internal_gates_passed
    - current_provider_and_deadline_gates_passed
    - predictive_controller_disabled
    - clean_resource_interval
    - resource_profile_publication_authority
    - active_or_explicit_target_still_current
  rules:
    - "Timing authority is the Engine-owned semantic timing identity: timing/search contract, model semantics, provider/runtime and hardware identity, and effective search topology. The executable digest and full UCI option inventory are retained as provenance and do not invalidate an already-qualified profile when only unrelated build content changes."
    - "Fresh timing jobs and their produced artifacts remain bound to the exact registered target executable that actually ran; semantic profile reuse must not weaken job or observation provenance."
    - "The qualifier candidate mode cannot write the live cache."
    - "The qualifier candidate and checkpoint paths are job-owned; candidate attempts remain beside the candidate and resume reuses only the qualifier's identity-bound immutable diagnostic."
    - "Current v3 profiles emit an explicit permission projection. For an otherwise valid older v3 artifact that lacks only that additive projection, Evidence may derive provider and forecast qualification from the complete current gate set while keeping adaptive play false; an explicit false permission is never upgraded."
    - "The service archives the prior profile and atomically publishes the candidate."
    - "The published profile keeps adaptive_play_qualified=false."
    - "No UCI option or engine default changes as a side effect."
  public_projection:
    command: profile_list
    schema: uci_arena_evidence_profile_v1
    sources: [service_live_cache, explicit_import]
    fields:
      - path
      - source
      - sha256
      - profile_schema
      - published_at
      - identity_sha256
      - target_identity
      - permissions
      - service_publication
    rules:
      - "Profile list validates the complete stored profile before projecting it."
      - "Configured imports are explicit non-secret file paths; the service never scans for them."
      - "A missing or invalid configured import fails visibly instead of being reported as an available profile."
      - "Live-cache candidates are limited to exact registered target model ids under runtimeModelsRoot."

manager_integration_api:
  schema: uci_arena_manager_service_api_v1
  version: '1.0'
  transport: cli_json
  invocation: [api]
  operations:
    - describe
    - status
    - outputs_list
    - outputs_inspect
    - config_validate
    - orchestration_status
    - target_register
    - campaign_enqueue
    - job_control
    - startup_recover
  output_schema: uci_arena_service_output_v1
  startup_recovery_rule: "startup_recover is credential-free and starts only an existing current-configuration per-user registration; it never creates, replaces, enables, disables, or deletes registration."
  output_kinds: [evidence.dataset, timing_profile.qualified]
  rules:
    - "The installed component manifest is the only discovery authority for the API entrypoint, version, transport, and invocation prefix."
    - "Manager invokes the service CLI and consumes one JSON response; Evidence Service never calls or imports Manager."
    - "The orchestration projection exposes at most 64 newest target identity summaries and 512 job lifecycle summaries, prioritizing unfinished jobs before the most recently updated terminal jobs. It publishes the exact limits and truncation flags."
    - "Target register accepts one exact typed deployment supplied by Manager from an already registered engine resource. Evidence validates absolute regular-file and directory paths, hashes the engine itself, permits only the provider allowlist and bounded scalar UCI options, and returns the existing target when every identity field is unchanged."
    - "Target register never accepts a command, adapter, arbitrary argv, browser-selected executable, engine digest, or provider-private configuration. Manager remains UCI probe authority and Evidence remains target identity authority."
    - "Orchestration summaries contain no paths, job configuration, fingerprints used only for catalog deduplication, or raw evidence; bounded wait/error diagnostics replace absolute Windows, UNC, and POSIX paths with a redaction marker."
    - "Campaign enqueue is limited to the built-in first campaign and an optional existing service-issued target UUID. Omission delegates default-target resolution to Evidence Service; Manager cannot submit arbitrary adapters, flags, commands, or target-count-derived defaults through this API."
    - "Job control is limited to cancel and retry against a service-issued job UUID and preserves the service-owned lifecycle rules."
    - "Dataset records expose stable identity, state, observation count, target identity, explicit authority, and a typed dataset-export invocation without exposing raw observations."
    - "Profile records expose only profiles admitted by listQualifiedProfiles, including exact file digest, target identity, permissions, publication identity, and controlled regular-file path."
    - "Output inspect accepts only service-issued dataset UUID or profile SHA-256 identities."
    - "A supplied cursor may suppress an unchanged output list but never changes evidence or profile authority."
    - "The API never returns SQL rows, catalog paths, credential data, runtime secrets, or unvalidated artifact-store paths."
    - "Installer retains installation and suite-promotion authority; Manager must preserve diagnostic-only, timing, strength, profile-publication, and adaptive-play distinctions in its installed-suite projections and controls."
    - "Unknown API major versions and unknown operations fail closed."
    - "Status publishes daemon.active, daemon.processAlive, and daemon.stale as provider-owned runtime authority. Active is true only when the recorded exact process instance is current, the heartbeat is within stale_seconds, and the phase is neither stopped nor failed; a remembered phase, pid, startup registration, or desired state is never live authority."

first_campaign:
  candidate_option: "McgsTemporalWeightProfile=AdaptiveCurveV1"
  control_option: "McgsTemporalWeightProfile=EarlyCurrent"
  core_time_controls: ["30+0", "60+2", "180+0", "180+3"]
  staged_time_controls: ["40/120+5"]
  stockfish_depths: [8, 10, 12, 14]
  order:
    - deadline_and_provider_qualification
    - clocked_time_use_curve
    - paired_candidate_control_strength
    - fixed_identity_stockfish_anchors
    - staged_control
  rules:
    - "Every strength opening is played with reversed colors."
    - "Candidate/control pairs differ only in the declared experimental UCI options."
    - "AdaptiveCurveV1 campaign results are offline evidence only. They cannot change the tracked EarlyCurrent live authority or grant temporal-curve deployment authority."
    - "Stockfish identity, net, threads, hash, options, and depth are recorded."
    - "Small or incomplete samples are retained without strength conclusions."

validation:
  required:
    - config_catalog_and_schema_unit_tests
    - target_identity_and_drift_tests
    - resource_threshold_and_lease_contention_tests
    - foreground_preemption_under_two_seconds
    - process_tree_cleanup
    - crash_resume_without_duplicate_authority
    - adapter_fixture_contract_tests
    - canonical_history_and_color_pair_tests
    - qualifier_candidate_publication_tests
    - contaminated_interval_diagnostic_only_tests
    - audited_prune_tests
    - idle_daemon_cpu_below_one_percent
    - idle_daemon_rss_at_most_150_mib
    - foreground_training_and_match_regression_at_most_two_percent
    - windows_task_scheduler_contract_test
    - linux_systemd_user_unit_contract_test
    - startup_install_active_and_current_configuration_contract_tests
    - startup_uninstall_bounded_exact_daemon_exit_contract_test
    - manager_api_startup_recover_preserves_registration
    - stale_daemon_lock_with_reused_live_pid_is_reclaimed
    - exact_live_daemon_owner_is_never_displaced
    - idempotent_typed_manager_target_registration_test
    - windows_job_object_and_linux_process_group_cleanup_tests

relocatable_install:
  package_root: derived_from_import_meta
  runtime_root: explicit_UCI_ARENA_EVIDENCE_RUNTIME_ROOT_or_package_root_development_default
  repository_checkout_required: false
  packaged_runtime:
    component_id: uci_arena_evidence.runtime
    owner_repository: iteathen/UCI_Arena
    required_contract: uci_arena_evidence_runtime_v1
    required_entrypoints:
      timing_profile: engine/tools/qualify_uci_time_profile.mjs
      paired_sprt: arena/run_sprt_match.mjs
      complete_game: arena/run_complete_game_matrix.mjs
      referee:
        windows-x86_64: bin/uci_arena_complete_game_referee.exe
        linux-x86_64: bin/uci_arena_complete_game_referee
  rules:
    - "Installed configuration may declare the absolute evidence-runtime component root. Resolution precedence is an explicit UCI_ARENA_EVIDENCE_RUNTIME_ROOT invocation override, then the validated configuration value, then the service package root development default."
    - "The component manifest declares product_data as its suite workspace placement. A conforming Installer resolves that placement beneath its mutable per-user or per-machine product data root, while standalone Evidence Service retains its own platform default and explicit --workspace override."
    - "Configuration loading must preserve the selected runtime root instead of replacing it with the Evidence Service package root; repositoryRoot is a compatibility projection of that same selected runtime root, not a second authority."
    - "The component artifact declares Evidence Service discovery as an active-root resource; Installer and Manager never infer that role from its component id."
    - "The component publishes a bounded installer-integration entrypoint that owns Evidence configuration and active-target document generation from declared dependency and timing-profile bindings."
    - "The published component contains the complete regular-file runtime closure of every declared Node entrypoint, including the vendored time-profile contract used by installer integration. Release construction imports each staged entrypoint in an isolated Node process before creating the archive; source-tree availability is not package evidence."
    - "Installer integration validates a supplied timing profile through the Engine-owned time-profile contract, records the installed engine digest as current target provenance, and does not equate a historical profile executable digest with timing authority. Runtime consumers revalidate the profile's semantic timing identity before applying it."
    - "Installer supplies validated paths through the versioned installation context and does not interpret Evidence configuration fields, profile semantics, or active-target document contents."
    - "The component manifest declares the Evidence startup CLI, exact action arrays, workspace/configuration flags, root response shape, and mandatory configuration-match plus live-daemon evidence; Installer does not contain an Evidence-specific health branch."
    - "Adapters resolve allowlisted tools from config.runtimeRoot, not a compile-time repository path."
    - "Before constructing a queued adapter command, the service validates contracts/evidence-runtime-contract.json and every current-platform allowlisted entrypoint inside runtimeRoot."
    - "An absent runtime remains a healthy state while no job is runnable; an absent, malformed, mismatched, or escaping runtime contract fails the job before subprocess creation."
    - "Startup registrations use packageRoot as WorkingDirectory."
    - "Engine, Stockfish, model, referee, and runner locations remain explicit typed configuration."
    - "Restaurant locations are detection-only and are never inferred from the installed component parent."
    - "The opt-in source integration test receives an explicit test-only Evidence Runtime root. It must not repurpose UCI_ARENA_EVIDENCE_RUNTIME_ROOT or alter the production precedence between invocation override, installed configuration, and development default."

offline_locator_adoption_2026_10_11:
  status: active
  owner: evidence_service_provider
  command: "workspace adopt-locators --source-workspace ABSOLUTE_OLD --workspace ABSOLUTE_COPIED_NEW [--maximum-milliseconds 1..60000]"
  response_schema: uci_arena_evidence_locator_adoption_v1
  rules:
    - "The provider alone adopts locators after an operator-authorized quiesced workspace copy. Installer and Manager never open or rewrite the catalog."
    - "Pause the source through its public operation, perform verified startup uninstall, copy catalog and declared durable artifact/attempt data while retaining originals, then adopt before fresh startup install. Copying locks, heartbeat or startup authority is unnecessary; adoption never removes them."
    - "Both distinct, non-nested workspaces and existing catalog files are ordinary contained paths; both catalogs must already have exact schema 3. The destination must already be paused. There is no source/runtime directory creation, catalog construction, migration, interrupted-job recovery, resume, engine launch or task effect."
    - "Source SQLite and existing WAL bytes are streamed into an exact owned private directory beneath the destination. Only this private snapshot is opened by SQLite, so source coordination files are never created. Whole original catalog/WAL digests, file identities, sizes and modification/change times are checked again before commit; read access times remain operating-system policy. Joined cleanup removes only exact owned snapshot files and directory."
    - "Startup registration must be absent at both observations. Every retained source and destination daemon identity in catalog, lock and heartbeat requires an exact same-platform absent or PID-reused process observation. Missing, legacy, malformed, live or unverifiable ownership fails closed rather than using heartbeat age or phase as process absence."
    - "Offline mutation accepts only the closed typed uci_arena_evidence_startup_presence_v1 absent observation. Windows queries the exact local root-folder task through Task Scheduler COM and admits absence only from typed COMException HRESULT_FROM_WIN32(ERROR_FILE_NOT_FOUND) at GetTask; activation, connection, root-folder, access-denied, unexpected HRESULT, timeout, malformed output and release failures are unverifiable. Legacy schtasks numeric exit codes and localized/raw diagnostics never prove absence. Linux unit-path ENOENT is distinguished from access denial and other observation failures."
    - "The provider validates equal artifact and attempt locator inventories against the original catalog. Each original locator is contained beneath its exact owned artifacts or attempts root, and the copied locator is either the original path or its matching new relative location."
    - "Original and copied ordinary artifact files must match catalog SHA-256 and length; nonempty attempt-log locators require original and copied ordinary files with identical bytes. Symlink/reparse ancestors, streams, missing files, mismatches, file identity drift, source catalog/WAL drift, retained rollback journals and unexpected SQL triggers fail closed before commit."
    - "One exclusive destination transaction changes only artifacts.path, attempts.stdout_path and attempts.stderr_path. All other columns, opaque JSON, historical paths inside provenance, observations, datasets, jobs, resource authority and source originals remain unchanged. Already adopted inventories are verified on retry."
    - "The operation bounds plans to 1000000 rows and 64 MiB, individual files to 1 TiB, streamed reads to 1 MiB chunks, SQLite waits to one second, and cooperative work to at most 60000 ms. Existing bounded native identity, startup and record readers remain authoritative; no hard native preemption is claimed."
    - "The command works with default standalone configuration and the packaged Windows identity helper without a selected runtime or engine. Closed responses expose counts and a locator-projection digest, never raw catalog rows, paths, private producer messages or credentials. Success follows confirmed commit and joined close; uncertain commit or cleanup failure never becomes success."

provider_release_reproducibility_2026_08_01:
  status: active
  owner: evidence_service_provider_release
  rules:
    - "A Windows Evidence Service candidate builds the shared native helpers twice from independent empty build and staging roots; repacking one staged payload is not reproducibility evidence."
    - "Both complete unsigned component archives and both provider-result predicates are byte-identical before signing or publication."
    - "The exact native toolchain receipt binds component id, target, source commit, workflow identity, and primary plus reproduction build roles."
    - "The Linux service artifact contains no native helper bytes and neither requires nor invents native toolchain evidence."
    - "A mismatch blocks publication and reports both archive digests plus the first differing payload path."
