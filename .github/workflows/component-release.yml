name: Windows lifecycle diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        serialization: [convert_to_json, console_fields]
        sample: [1, 2]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.15.0
      - name: Install exact declared dependency closure
        run: npm ci
      - name: Capture raw process identity and owned-tree errors
        shell: pwsh
        run: node tools/windows_lifecycle_diagnostic.mjs ${{ matrix.serialization }}
      - name: Run unchanged failing lifecycle gates
        if: always()
        shell: pwsh
        run: node --test --test-name-pattern 'daemon status requires|daemon recovers a stale lock|daemon lock reclaims pid reuse|cross-platform child shutdown' test/evidence_service.test.mjs
